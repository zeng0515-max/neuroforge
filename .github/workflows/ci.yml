name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check app/
      - run: mypy app/ --ignore-missing-imports

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # 当前覆盖基线 56.65%，门禁先锁 55% 防回退，后续通过补测试逐步提高到 70%+
      - run: pytest tests/ -o "addopts=" -m "not slow" --cov=app --cov-report=term --cov-fail-under=58
      - if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: htmlcov/

  benchmark:
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python scripts/benchmark.py --dry-run --quick
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark-results/

  golden-eval:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python scripts/golden_eval.py --output-dir benchmark-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-eval
          path: benchmark-results/

  quality-gate:
    needs: [test, lint, golden-eval]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -o "addopts=" -m "not slow" --cov=app --cov-report=term-missing --cov-fail-under=58

  notify:
    if: failure()
    needs: [test, lint, benchmark, golden-eval, quality-gate]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          payload: '{"text":"❌ CI failed: ${{ github.sha }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
