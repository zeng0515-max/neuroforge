name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check app/

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio httpx
      - name: Run tests
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html \
            --ignore=tests/test_e2e.py --ignore=tests/test_mcp_integration.py
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t neuroforge:ci .
      - name: Verify container starts
        run: |
          docker run -d --name neuroforge-ci \
            -e LLM_API_KEY=fake-key \
            -p 8001:8001 \
            neuroforge:ci
          sleep 10
          curl -f http://localhost:8001/api/v1/health || (docker logs neuroforge-ci && exit 1)
          docker stop neuroforge-ci
