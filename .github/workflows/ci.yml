name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check app/
      # 类型检查当前是「建议项」：app/ 里还有约 97 处历史类型问题（未在本次整改范围内
      # 逐个清理），所以只记录不阻断，避免 CI 长期红灯掩盖真实回归。清理完成后把
      # continue-on-error 去掉即可变成硬门禁（见 README "Known gaps"）。
      - run: mypy app/ --ignore-missing-imports
        continue-on-error: true

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # 只跑 3.11：运行时依赖 chromadb>=0.5.23,<0.6 依赖 chroma-hnswlib 0.7.x，
      # 它没有 cp312 的 wheel，pip 在 3.12 上会退化成源码编译并失败。
      # 依赖升到 chromadb 1.x（EmbeddingFunction API 变更）之后再扩矩阵。
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # 打印环境，便于对照本地：runner 上的 Python / pytest / 关键依赖版本
      - name: Print environment
        run: |
          python -V
          python -m pip -V
          python -m pytest --version
          python -m pip list 2>/dev/null | grep -Ei '^(pytest|pytest-cov|chromadb|mcp|langchain|langgraph|fastapi|sqlalchemy)\b' || true
      # 当前覆盖基线 60%（语句+分支），门禁锁 59% 防回退，后续补测试逐步提到 70%+
      # 覆盖率口径：语句 + 分支（与 README「60% branch coverage」一致）
      # 用 `python -m pytest` 而不是裸 `pytest`：不依赖脚本是否进了 PATH。
      # 失败时把尾部输出打成 ::error:: 注释，未登录也能通过 check-run annotations
      # 读到原因（日志下载接口需要仓库管理员权限）。
      - name: Run tests
        run: |
          set +e
          python -m pytest tests/ -o "addopts=" -m "not slow" \
            --cov=app --cov-branch --cov-report=term --cov-fail-under=59 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "pytest exited with $rc"
            tail -40 pytest.log | while IFS= read -r line; do
              printf '::error::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$rc"
      - if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: htmlcov/

  benchmark:
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python scripts/benchmark.py --dry-run --quick
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark-results/

  golden-eval:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python scripts/golden_eval.py --output-dir benchmark-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-eval
          path: benchmark-results/

  quality-gate:
    needs: [test, lint, golden-eval]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -o "addopts=" -m "not slow" --cov=app --cov-report=term-missing --cov-branch --cov-fail-under=59

  notify:
    if: failure()
    needs: [test, lint, benchmark, golden-eval, quality-gate]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          payload: '{"text":"❌ CI failed: ${{ github.sha }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
