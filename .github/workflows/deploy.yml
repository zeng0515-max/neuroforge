name: Deploy

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multi-stage image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vulnerability-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan pushed image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  smoke:
    needs: vulnerability-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run image health smoke
        run: |
          docker run --rm \
            -e APP_ENV=prod \
            -e DB_PATH=/tmp/app.db \
            -e CHROMA_PERSIST_DIR=/tmp/chroma \
            -p 18001:8001 \
            -d --name neuroforge-smoke ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18001/api/v1/health >/dev/null 2>&1; then
              echo "health check passed"
              docker rm -f neuroforge-smoke
              exit 0
            fi
            sleep 3
          done
          docker logs neuroforge-smoke || true
          docker rm -f neuroforge-smoke
          echo "health check failed"
          exit 1
