[project]
name = "multi-agent-code-system"
version = "0.1.0"
description = "多智能体协同代码生成与审查系统"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "sse-starlette>=3.0.3",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.1",
    "SQLAlchemy>=2.0.36",
    "chromadb>=0.5.23",
    "openai>=1.109.1",
    "langchain>=0.3.14",
    "langchain-core>=0.3.31",
    "langchain-openai>=0.2.14",
    "langgraph>=0.2.62",
    "mcp>=1.1.0",
    "pytest>=8.3.4",
    "langgraph-checkpoint-sqlite<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[project.scripts]
neuroforge = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试默认走同步模式；个别异步用例显式标 asyncio_mode=auto 后用 @pytest.mark.asyncio
asyncio_mode = "auto"
# 测试中禁止真实网络/LLM 调用：通过环境变量在 conftest 中统一覆盖
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--showlocals",
]

[tool.ruff]
# 宽松配置：仅启用 E/F/W/I，避免对现有代码引入大量整改
target-version = "py311"
line-length = 120
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "data",
    "scripts",
    "generated.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # 行长由 formatter 控制；项目里多行字符串较多，放宽
    "E402",  # 模块顶部 import 之后还有副作用代码，常见且符合项目风格
    "E722",  # 现有 bare except 较多，单独整改超出本任务范围
    "E741",  # 现有代码有单字母变量名，保持兼容
    "F401",  # 部分模块 __all__ 控制导出，未使用 import 是有意保留
    "F841",  # 局部变量偶有副作用赋值，宽松处理
    "W605",  # 老代码中已有转义序列，避免破坏
    "F541",  # 现有代码多处 f-string 无占位符，整改超出本任务范围
    "W292",  # 现有代码多个文件末尾无换行，不修改业务代码
    "I001",  # 现有代码 import 排序不符合 isort，不修改业务代码
]

[tool.ruff.lint.per-file-ignores]
"app/*" = ["F821"]  # app/api/v1/tasks.py 有 llm 未 import 的已知问题，本任务不修业务代码
"tests/*" = ["F401", "F811"]
"app/schemas/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/__pycache__/*",
    # 测试代码本身不计入覆盖率
    "tests/*",
    # 调试/脚本入口不强制覆盖
    "app/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]