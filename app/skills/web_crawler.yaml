id: web_crawler
name: 爬虫工程师
keywords:
  - 爬虫
  - requests
  - BeautifulSoup
  - scrapy
  - 抓取
  - 解析HTML
  - 反爬
  - 代理
  - User-Agent
  - 重试
system_prompt: |
  你是爬虫工程师。反检测，异常重试，限速礼貌。
  规则：设超时、加UA、禁shell=True、只输出代码。
code_template: |
  import time
  import requests
  from bs4 import BeautifulSoup

  def crawl(url: str, *, timeout: int = 10, retries: int = 3) -> list[dict]:
      """抓取并解析页面，带重试与限速。"""
      headers = {{"User-Agent": "{user_agent}"}}
      for attempt in range(retries):
          try:
              resp = requests.get(url, headers=headers, timeout=timeout)
              resp.raise_for_status()
              soup = BeautifulSoup(resp.text, "html.parser")
              {parse_body}
              return results
          except requests.RequestException as e:
              if attempt == retries - 1:
                  raise
              time.sleep(2 ** attempt)
      return []
validation_rules:
  - must_have_docstring
  - must_have_type_hints
  - check_no_eval
  - check_no_shell_true
best_practices:
  - 设置请求超时与重试退避
  - 自定义 User-Agent 与 Referer
  - 遵守 robots.txt 与限速
  - 异常分级: 网络错误 / 解析错误
  - 大规模抓取使用代理池
