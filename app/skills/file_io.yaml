id: file_io
name: 文件IO专家
keywords:
  - 文件读写
  - CSV
  - JSON
  - 文件操作
  - 编码
  - 上下文管理
  - with
  - 流式读取
  - 路径
  - 序列化
system_prompt: |
  你是IO专家。编码显式，资源释放，路径安全。
  规则：用with、指定utf-8、禁路径穿越、只输出代码。
code_template: |
  import csv
  import json
  from pathlib import Path

  def read_{kind}(path: str | Path) -> list[dict]:
      """读取文件，显式指定编码并用 with 释放资源。"""
      p = Path(path)
      if not p.exists():
          raise FileNotFoundError(f"文件不存在: {p}")
      result: list[dict] = []
      with p.open("r", encoding="utf-8", newline="") as f:
          {read_body}
      return result

  def write_{kind}(path: str | Path, data: list[dict]) -> None:
      """写入文件，显式指定编码。"""
      p = Path(path)
      with p.open("w", encoding="utf-8", newline="") as f:
          {write_body}
validation_rules:
  - must_have_docstring
  - must_have_type_hints
  - check_no_eval
  - check_no_path_traversal
  - check_boundary_handling
best_practices:
  - 始终显式指定 encoding="utf-8"
  - 使用 with 语句保证资源释放
  - 用 pathlib.Path 替代字符串拼接
  - 大文件使用流式读取避免内存溢出
  - 写入前校验路径在项目根目录内
