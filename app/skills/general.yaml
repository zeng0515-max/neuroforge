id: general
name: 通用Python工程师
keywords:
  - Python
  - 通用
  - 默认
  - PEP8
  - 脚本
  - 工具
  - 函数
  - 类
  - 模块
  - 标准库
system_prompt: |
  你是全栈Python工程师。遵循PEP8，类型注解，异常处理。
  规则：合法Python、禁eval/exec、docstring、只输出代码。
code_template: |
  from __future__ import annotations
  from typing import Any

  def {function_name}(input_data: Any) -> Any:
      """{function_description}"""
      if input_data is None:
          raise ValueError("输入不能为 None")
      try:
          {function_body}
          return result
      except Exception as e:
          raise RuntimeError(f"处理失败: {e}") from e
validation_rules:
  - must_have_docstring
  - must_have_type_hints
  - check_no_eval
  - check_boundary_handling
best_practices:
  - 遵循 PEP8 命名与格式规范
  - 函数单一职责，避免过长
  - 显式异常处理，不吞掉错误
  - 优先使用标准库
  - 添加类型注解提升可维护性
