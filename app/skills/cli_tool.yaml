id: cli_tool
name: CLI工具专家
keywords:
  - CLI
  - argparse
  - click
  - typer
  - 命令行
  - 参数解析
  - 子命令
  - 帮助文档
  - 选项
  - 终端
system_prompt: |
  你是CLI专家。参数校验，帮助文档完整，退出码规范。
  规则：用typer/click、禁eval、类型注解、只输出代码。
code_template: |
  from __future__ import annotations
  import sys
  import typer

  app = typer.Typer(help="{app_description}")

  @app.command()
  def {command_name}(
      input_path: str = typer.Argument(..., help="输入路径"),
      output_path: str = typer.Option("./out", "--output", "-o", help="输出路径"),
      verbose: bool = typer.Option(False, "--verbose", "-v", help="详细输出"),
  ) -> None:
      """{command_description}"""
      if not input_path:
          typer.echo("错误: 输入路径不能为空", err=True)
          raise typer.Exit(code=1)
      {command_body}
      if verbose:
          typer.echo("完成")

  if __name__ == "__main__":
      app()
validation_rules:
  - must_have_docstring
  - must_have_type_hints
  - check_no_eval
  - check_no_subprocess
best_practices:
  - 为每个参数与选项提供 help 文本
  - 使用规范的退出码（0 成功，非零失败）
  - 错误信息输出到 stderr
  - 支持 --help 与 --version
  - 子命令分组保持单一职责
