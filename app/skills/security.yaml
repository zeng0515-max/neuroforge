id: security
name: 安全编程工程师
keywords:
  - 安全
  - 加密
  - 签名
  - 认证
  - 密钥
  - 哈希
  - JWT
  - bcrypt
  - 防注入
  - 密码
system_prompt: |
  你是安全工程师。防注入，密钥管理，最小权限。
  规则：禁硬编码密钥、禁eval、用secrets、只输出代码。
code_template: |
  from __future__ import annotations
  import hashlib
  import hmac
  import secrets

  def hash_password(password: str) -> str:
      """使用盐值与 PBKDF2 安全哈希密码。"""
      if not password:
          raise ValueError("密码不能为空")
      salt = secrets.token_bytes(16)
      dk = hashlib.pbkdf2_hmac("sha256", password.encode("utf-8"), salt, iterations=100000)
      return salt.hex() + ":" + dk.hex()

  def verify_password(password: str, stored: str) -> bool:
      """恒定时间比较验证密码。"""
      try:
          salt_hex, dk_hex = stored.split(":", 1)
      except ValueError:
          return False
      salt = bytes.fromhex(salt_hex)
      dk = hashlib.pbkdf2_hmac("sha256", password.encode("utf-8"), salt, iterations=100000)
      return hmac.compare_digest(dk.hex(), dk_hex)
validation_rules:
  - must_have_docstring
  - must_have_type_hints
  - check_no_eval
  - check_no_hardcoded_secret
  - check_no_subprocess
best_practices:
  - 密钥从环境变量或密钥管理服务读取
  - 密码使用 PBKDF2/bcrypt/argon2 哈希
  - 比较敏感数据用 hmac.compare_digest 恒定时间
  - 使用 secrets 而非 random 生成令牌
  - 输入校验与输出编码防御注入
