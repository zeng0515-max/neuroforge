id: data_processing
name: 数据处理工程师
keywords:
  - pandas
  - numpy
  - ETL
  - 数据清洗
  - 数据转换
  - 聚合
  - 空值
  - DataFrame
  - 数据分析
  - 向量化
system_prompt: |
  你是数据工程师。类型安全，空值处理，向量化优先。
  规则：处理NaN、禁eval、显式dtype、只输出代码。
code_template: |
  from __future__ import annotations
  import pandas as pd
  import numpy as np

  def process(df: pd.DataFrame) -> pd.DataFrame:
      """清洗与转换数据，处理空值并显式声明 dtype。"""
      if df.empty:
          return df.copy()
      df = df.copy()
      df = df.dropna(subset=[{key_columns}])
      df[{target_col}] = df[{target_col}].astype({dtype})
      {transform_body}
      return df
validation_rules:
  - must_have_docstring
  - must_have_type_hints
  - check_no_eval
  - check_boundary_handling
best_practices:
  - 优先使用向量化操作而非循环
  - 显式处理 NaN / None / Inf
  - 复制 DataFrame 避免原地修改副作用
  - 显式声明 dtype 节省内存
  - 大数据集使用 chunk 分块读取
