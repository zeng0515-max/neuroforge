<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroForge — 多智能体协同 Dashboard</title>
<link rel="stylesheet" href="css/theme.css?v=1">
<link rel="stylesheet" href="css/dashboard.css?v=3">
</head>
<body data-theme="dark">

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">NeuroForge</div>
    <div class="logo-sub">Multi-Agent Code System</div>
  </div>
  <div class="task-list" id="taskList">
    <div class="task-empty-hint">
      提交一个需求<br>开始多智能体协作
    </div>
  </div>
  <div class="sidebar-footer">
    <span id="wsStatusLegacy"><span class="status-dot pending"></span>未连接</span>
    <span>v2.0</span>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="main-header">
    <button class="mobile-toggle" id="mobileToggle" aria-label="打开侧边栏">☰</button>
    <h2 id="headerTitle">Pipeline Dashboard</h2>
    <span class="header-task-id" id="taskIdDisplay"></span>

    <div class="header-status" id="headerStatus" aria-live="polite">
      <span class="status-chip" id="systemStatusChip">
        <span class="status-dot pending"></span>
        <span class="status-text">系统待机</span>
      </span>
      <span class="status-chip" id="wsStatusChip">
        <span class="status-dot pending"></span>
        <span class="status-text">WS 未连接</span>
      </span>
    </div>

    <button class="btn" onclick="window.__dashboard.toggleAutoScroll()" id="autoScrollBtn" aria-label="切换自动滚动">Auto Scroll: ON</button>
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙 <span>暗色</span></button>
    <button class="btn cmd-palette-trigger" onclick="window.__dashboard.toggleCommandPalette()" aria-label="打开命令面板 (Ctrl+K)">⌘K</button>
  </div>

  <div class="content">
    <!-- Agent Flow Panel -->
    <div class="agent-flow-panel" id="agentFlowPanel">
      <div class="agent-flow-header">
        <h3>Agent 流程图</h3>
        <span class="flow-status" id="flowStatus">IDLE</span>
      </div>
      <div class="agent-flow-svg-wrap">
        <svg id="agentFlowSvg" viewBox="0 0 280 500" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="flow-metrics">
        <div class="flow-metric">
          <div class="fm-label">阶段</div>
          <div class="fm-value" id="fmStage">-</div>
        </div>
        <div class="flow-metric">
          <div class="fm-label">进度</div>
          <div class="fm-value" id="fmProgress">-</div>
        </div>
        <div class="flow-metric">
          <div class="fm-label">耗时</div>
          <div class="fm-value" id="fmElapsed">-</div>
        </div>
      </div>
    </div>

    <!-- Graph Panel + Token Stream + Replay -->
    <div class="graph-panel" id="graphPanel">
      <canvas id="graphCanvas"></canvas>
      <div class="no-task-overlay" id="noTaskOverlay">
        <div class="empty-hero">
          <div class="empty-icon" aria-hidden="true">◉</div>
          <h3 class="empty-title">系统就绪</h3>
          <p class="empty-subtitle">在底部输入框描述需求，启动多智能体 Pipeline</p>
          <div class="empty-examples">
            <button class="example-chip" onclick="window.__dashboard.runExample('lru')" aria-label="运行 LRU Cache 示例">
              <span class="dot cyan"></span>LRU Cache
            </button>
            <button class="example-chip" onclick="window.__dashboard.runExample('api')" aria-label="运行 REST API 示例">
              <span class="dot magenta"></span>REST API
            </button>
            <button class="example-chip" onclick="window.__dashboard.runExample('scraper')" aria-label="运行 Web Scraper 示例">
              <span class="dot gold"></span>Web Scraper
            </button>
          </div>
          <div class="empty-hint">
            <span>提示：</span>按 <kbd>Ctrl</kbd>+<kbd>K</kbd> 打开命令面板
          </div>
        </div>
      </div>

      <!-- Token Stream Panel -->
      <div class="token-stream-panel" id="tokenStreamPanel">
        <div class="token-stream-header" onclick="TokenStream.toggle()">
          <h4><span class="live-indicator"></span>实时 Token 流</h4>
          <span class="token-stream-toggle" id="tokenStreamToggle">▼</span>
        </div>
        <div class="token-stream-body">
          <div class="token-stats"></div>
          <div class="token-stream-content"></div>
        </div>
      </div>

      <!-- Replay Panel -->
      <div class="replay-panel" id="replayPanel">
        <div class="replay-controls">
          <button class="replay-btn primary" id="replayPlay" title="回放" aria-label="回放" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="replay-btn" id="replayPause" title="暂停" aria-label="暂停" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
          </button>
          <button class="replay-btn" id="replayStop" title="停止" aria-label="停止">
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
          </button>
        </div>
        <input type="range" class="replay-slider" id="replaySlider" min="0" max="100" value="0" aria-label="回放进度">
        <div class="replay-info" id="replayInfo">就绪 0 事件</div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="panel-tabs" role="tablist" aria-label="右侧面板标签">
        <div class="panel-tab active" role="tab" aria-selected="true" tabindex="0" onclick="window.__dashboard.switchTab('logs')">Agent 日志</div>
        <div class="panel-tab" role="tab" aria-selected="false" tabindex="0" onclick="window.__dashboard.switchTab('code')">生成代码</div>
        <div class="panel-tab" role="tab" aria-selected="false" tabindex="0" onclick="window.__dashboard.switchTab('metrics')">指标</div>
        <div class="panel-tab" role="tab" aria-selected="false" tabindex="0" onclick="window.__dashboard.switchTab('review')">评审</div>
        <div class="panel-tab" role="tab" aria-selected="false" tabindex="0" onclick="window.__dashboard.switchTab('audit')">审计</div>
      </div>
      <div class="panel-content" id="panelContent">
        <div class="panel-empty">
          提交需求后，这里会显示<br>每个 Agent 的实时执行日志
        </div>
      </div>
    </div>
  </div>

  <!-- Approval Bar -->
  <div class="approval-bar" id="approvalBar">
    <span class="status-dot hitl"></span>
    <span class="msg" id="approvalMsg">人工审批: 生成的代码需要审查确认</span>
    <button class="btn primary" onclick="window.__dashboard.approveHITL(true)" aria-label="批准">批准</button>
    <button class="btn danger" onclick="window.__dashboard.approveHITL(false)" aria-label="拒绝">拒绝</button>
  </div>

  <!-- Prompt Input -->
  <div class="prompt-area">
    <textarea class="prompt-input" id="promptInput" rows="2"
      placeholder="输入需求描述... 例如：用 Python 实现一个 LRU Cache，支持 get/put 操作，O(1) 复杂度"
      aria-label="需求输入"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();window.__dashboard.submitTask()}"></textarea>
    <button class="btn primary" id="submitBtn" onclick="window.__dashboard.submitTask()" aria-label="运行 Pipeline">运行 Pipeline</button>
  </div>
</div>

<!-- Command Palette -->
<div class="command-palette" id="commandPalette" role="dialog" aria-modal="true" aria-label="命令面板" hidden>
  <div class="command-palette-backdrop"></div>
  <div class="command-palette-dialog">
    <div class="command-palette-input-wrap">
      <span class="command-palette-icon" aria-hidden="true">⌘</span>
      <input type="text" class="command-palette-input" id="commandPaletteInput"
        placeholder="输入命令..." autocomplete="off" aria-label="命令搜索">
      <kbd class="command-palette-shortcut">Esc</kbd>
    </div>
    <div class="command-palette-list" id="commandPaletteList"></div>
    <div class="command-palette-footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>↵</kbd> 执行</span>
      <span><kbd>Esc</kbd> 关闭</span>
    </div>
  </div>
</div>

<script src="js/token_stream.js"></script>
<script src="js/agent_flow.js"></script>
<script src="js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  window.__dashboard.init();
});
</script>
</body>
</html>
